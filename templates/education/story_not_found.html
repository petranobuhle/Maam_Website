{% extends 'base.html' %}

{% block title %}Story not found | MAAM{% endblock %}

{% block content %}
<section class="page-hero">
    <div class="container narrow">
        <p class="eyebrow">Stories</p>
        <h1>Story not found</h1>
    </div>
</section>

<section class="section container narrow">

        <a class="button" href="{% url 'stories' %}">View all stories</a>
    </div>
</section>
{% endblock %}
